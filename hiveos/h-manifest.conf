# HiveOS custom miner manifest for avian-miner.
#
# HiveOS reads this before anything else and derives
# /hive/miners/custom/$CUSTOM_NAME from it, so CUSTOM_NAME must match the
# directory inside the package. scripts/linux/hiveos-package.sh builds a
# tarball whose single top-level directory is that name, and substitutes the
# version below from configure.ac so the two cannot drift.

CUSTOM_NAME=avian-miner
CUSTOM_VERSION=@VERSION@
CUSTOM_BUILD=1

# Written by h-config.sh from the flight sheet, read by h-run.sh, and shown
# in the "Setup Miner Config" box.
# Defaulted rather than assigned, so the three scripts can be exercised
# outside HiveOS by setting it first.
CUSTOM_CONFIG_FILENAME=${CUSTOM_CONFIG_FILENAME:-/hive/miners/custom/avian-miner/avian-miner.conf}

# HiveOS appends .log and tails it for the rig's log view.
CUSTOM_LOG_BASENAME=/var/log/miner/avian-miner/avian-miner

# The miner's own API, which h-stats.sh queries once a cycle. Loopback only:
# it is an unauthenticated control socket, so h-config.sh binds it to
# 127.0.0.1 and never passes --api-remote.
CUSTOM_API_PORT=4048
